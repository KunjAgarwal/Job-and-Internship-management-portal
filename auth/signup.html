<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Sign Up</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="signup-container">

        <h1>Create your account</h1>

        <p class="subtitle">
            Let's get your CareerConnect profile started.
        </p>


        <form action="#" method="post">


            <!-- Role Selection -->
            <div class="form-group">

                <label class="role-heading">
                    What are you here to do?
                </label>

                <div class="roles">


                    <!-- Job Seeker -->
                    <label class="role">

                        <input
                            type="radio"
                            name="role"
                            value="jobseeker"
                            required
                        >

                        <div class="role-card">

                            <div class="role-icon">
                                🎯
                            </div>

                            <div class="role-name">
                                I'm looking for a job
                            </div>

                            <div class="role-description">
                                Find opportunities and connect
                                with recruiters.
                            </div>

                        </div>

                    </label>


                    <!-- Employer -->
                    <label class="role">

                        <input
                            type="radio"
                            name="role"
                            value="employer"
                        >

                        <div class="role-card">

                            <div class="role-icon">
                                🏢
                            </div>

                            <div class="role-name">
                                I'm hiring talent
                            </div>

                            <div class="role-description">
                                Discover candidates and build
                                your team.
                            </div>

                        </div>

                    </label>


                </div>

            </div>


            <!-- Full Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Gmail -->
            <div class="form-group">

                <label for="email">
                    Gmail
                </label>

                <div class="email-box">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="yourname@gmail.com"
                        required
                    >

                    <span class="gmail">
                        <!-- @gmail.com -->
                    </span>

                </div>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        minlength="8"
                        required
                    >


                </div>

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirm">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm"
                    name="confirm"
                    placeholder="Re-enter your password"
                    required
                >

            </div>


            <!-- Submit -->
            <button
                type="submit"
                class="create-btn"
            >
                Create Account →
            </button>


        </form>


        <!-- Login -->
        <div class="login">

            Already have an account?

            <a href="login.html">
                Log in
            </a>

        </div>

    </div>

</body>

</html>
