<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Login</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    
    <div class="login-container">

        <!-- Logo -->
         <div class="login-logo">
            CareerConnect
        </div>
        


        <!-- Heading -->
        <div class="login-header">

            <h1>
                Welcome back 👋
            </h1>

            <p>
                Log in to continue to CareerConnect.
            </p>

        </div>


        <form action="#" method="post">


            <!-- Gmail -->

            <div class="form-group">

                <label for="email">
                    Gmail
                </label>

                <div class="email-box">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="name@gmail.com"
                        required
                    >

                    <span class="gmail">
                        @gmail.com
                    </span>

                </div>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="login-password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        minlength="8"
                        required
                    >

                    <span class="lock-icon">
                        🔒
                    </span>

                </div>

            </div>


            <!-- Remember / Forgot -->

            <div class="login-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <a href="#" class="forgot">
                    Forgot password?
                </a>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="create-btn login-btn"
            >
                Login →
            </button>


        </form>


        <!-- Divider -->

        <div class="divider">
            <span>OR</span>
        </div>


        <!-- Signup -->

        <div class="login">

            Don't have an account?

            <a href="signup.html">
                Create one
            </a>

        </div>

    </div>

</body>

</html>
